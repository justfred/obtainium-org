<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>WikiFred</title>
    <link rel="stylesheet" href="/wiki/css/style.css">
    <link rel="stylesheet" href="/wiki/pagefind/pagefind-ui.css">
  </head>
  <body data-rotate="0">
    <header class="site-head">
      <a class="brand" href="/wiki/" id="brand-random">WikiFred</a>
      <nav class="top-links">
        <a href="/wiki/browse/">Index</a>
        <a href="/wiki/search/">🔍 Search</a>
        <a href="/wiki/" id="header-random" title="random article">🎲 Random</a>
      </nav>
    </header>

    <main>
      <section class="welcome">
  <p class="kicker">Welcome</p>
  <h1>WikiFred</h1>
  <p class="lede">A life, threaded. Start anywhere — here's one to begin with.</p>

  <div id="featured" class="featured" aria-live="polite">
    <p class="loading">Picking a story…</p>
  </div>

  <p class="welcome-actions">
    <button id="reroll" class="btn" type="button">↻ another</button>
    <a class="btn" href="/wiki/browse/">Browse the index →</a>
  </p>
</section>

    </main>

    <footer class="site-foot">
      <span>A life, threaded.</span>
      <span class="foot-comment">
        <a id="comment-link" href="mailto:justfred@obtainium.org">Comment</a>
        <span class="foot-email"> · justfred@obtainium.org</span>
      </span>
    </footer>

    <script>window.WF_BASE = "/wiki/";</script>
    <script src="/wiki/pagefind/pagefind-ui.js"></script>
    <script>if (document.getElementById("search")) new PagefindUI({ element: "#search", bundlePath: "/wiki/pagefind/", showImages: false });</script>
    <script src="/wiki/js/wikifred.js" type="module"></script>
    <script data-goatcounter="https://obtainium.goatcounter.com/count" async="" src="//gc.zgo.at/count.js"></script>
  </body>
</html>
