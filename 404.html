    <main>
      <section class="search-page">
  <h1>Not here</h1>
  <p class="lede">This page may have moved — the site is being reorganized. Here's a search for it:</p>
  <div id="search"></div>
</section>
<script>
  // Served as the site-wide 404 (deploy copies it to the site root), so build the
  // query from whatever path was asked for: /wiki/articles/sous-vide-steak/ → "sous vide steak".
  window.searchFromPath = location.pathname.split("/")
    .filter(s => s && !/^(index\.html?|articles|thread|wiki|biography|food-and-drink|pub|dev)$/i.test(s))
    .map(s => decodeURIComponent(s).replace(/\.html?$/i, "").replace(/^\d{4}-\d{2}-\d{2}-?/, "").replace(/[-_.]+/g, " "))
    .join(" ").trim();
</script>

    </main>

    <footer class="site-foot">

    </footer>

    <script>window.WF_BASE = "/biography/";</script>
    <script src="/pagefind/pagefind-ui.js"></script>
    <script>
      if (document.getElementById("search")) {
        const ui = new PagefindUI({ element: "#search", bundlePath: "/pagefind/", showImages: false });
        // ?q=… (search page) or the broken URL's words (404) pre-fill the search
        const q = new URLSearchParams(location.search).get("q") || window.searchFromPath;
        if (q) ui.triggerSearch(q);
      }
    </script>
